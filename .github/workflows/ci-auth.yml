name: CI auth

on:
  push:
    branches:
      - main
    paths:
      - "auth/**"
      - "!auth/authpg/**"
      - "!auth/authhttp/**"
      - "!auth/authconnect/**"
  pull_request:
    paths:
      - "auth/**"
      - "!auth/authpg/**"
      - "!auth/authhttp/**"
      - "!auth/authconnect/**"

jobs:
  ci:
    uses: ./.github/workflows/ci-go-module.yml
    with:
      module_path: auth
