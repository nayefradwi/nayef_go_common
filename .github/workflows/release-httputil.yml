name: Release httputil

on:
  push:
    branches:
      - main
    paths:
      - "httputil/**"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version segment to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    # a dispatch from another branch would tag a commit that isn't on main
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-go-module.yml
    with:
      module_path: httputil
      # empty on push runs, so the merged PR's labels decide
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit
