name: Release auth

on:
  push:
    branches:
      - main
    paths:
      - "auth/**"
      - "!auth/authpg/**"
      - "!auth/authhttp/**"
      - "!auth/authconnect/**"
      - "!auth/authredis/**"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/deploy-go-module.yml
    with:
      module_path: auth
      bump_type: patch
    secrets: inherit
